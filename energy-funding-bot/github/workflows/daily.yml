name: Daily Energy Funding Report

on:
  schedule:
    # 13:00 UTC = 6:00 AM Pacific (summer) / 5:00 AM (winter). Adjust to taste.
    - cron: "0 13 * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write          # needed to commit the updated report + state

concurrency:
  group: funding-report
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python run.py

      - name: Commit report
        run: |
          git config user.name  "funding-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/index.html data/seen.json
          if git diff --staged --quiet; then
            echo "No changes today."
          else
            git commit -m "Funding report $(date -u +%Y-%m-%d)"
            git push
          fi
